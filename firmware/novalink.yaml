# NovaLink V1 - ESPHome firmware (test version)
#
# ESP32-C3 SuperMini <-> CA-IS3721HS isolator <-> stove NAVEL INSIDE port (+5V, SER, GND).
# TX = GPIO5, RX = GPIO20, no inversion. Single-wire line: the board receives its own bytes (echo: true).
# Uses the micronova component from a fork with single-wire support (optional enable_rx_pin, echo,
# any baud rate). Branch based on ESPHome 2026.10.2.
#
# Addresses checked on a Micronova X100 EVO board. Never write to RAM 0x58 on this board
# (it raises the "fumes probe" alarm): do not add a custom button on that address.

substitutions:
  name: novalink
  friendly_name: NovaLink

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source: github://benbox69/esphome@micronova-navel-2026.10
    components: [micronova]

logger:
  hardware_uart: USB_SERIAL_JTAG   # keeps both hardware UARTs free

api:
  encryption:
    key: !secret novalink_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

status_led:
  pin: GPIO10   # LED1, active high

uart:
  id: stove_uart
  tx_pin: GPIO5
  rx_pin: GPIO20
  baud_rate: 19200   # NAVEL INSIDE port (SERIAL port: 1200 baud, stop_bits: 2)
  data_bits: 8
  parity: NONE
  stop_bits: 1

micronova:
  uart_id: stove_uart
  echo: true         # no enable_rx_pin on NovaLink

sensor:
  - platform: micronova
    room_temperature:
      name: "Room temperature"
      update_interval: 30s
    fumes_temperature:
      name: "Fumes temperature"
      memory_address: 0x59   # X100 EVO (default 0x5A reads 0)
      update_interval: 30s
    stove_power:
      name: "Stove power"
      update_interval: 30s
    fan_speed:
      name: "Fumes fan speed"
      update_interval: 30s

text_sensor:
  - platform: micronova
    stove_state:
      name: "Stove state"
      update_interval: 10s

number:
  - platform: micronova
    thermostat_temperature:
      name: "Thermostat setpoint"
      update_interval: 30s
    power_level:
      name: "Power level"
      update_interval: 30s

switch:
  - platform: micronova
    stove:
      name: "Stove on/off"
      update_interval: 10s
